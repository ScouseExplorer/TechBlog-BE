services:

  backend:
    build:
      context: .
      dockerfile: .dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@database:5432/techblog
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm start"]

volumes:
  postgres_data: