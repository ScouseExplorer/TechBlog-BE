services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: techblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techblog"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: .dockerfile
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@database:5432/techblog
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm start"]

volumes:
  postgres_data: