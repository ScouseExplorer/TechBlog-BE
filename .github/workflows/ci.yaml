name: GitHub actions Demo 

# this defines the evnts that trigger the workflow 
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# a workflow that is made up of one or more jobs 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test